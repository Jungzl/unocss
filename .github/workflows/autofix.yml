name: autofix.ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js lts/*
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install
        env:
          CYPRESS_INSTALL_BINARY: 0

      - run: pnpm lint --fix

      # `prepare` runs during install and used to refresh the generated iconify
      # collection list. Never include that unrelated change in an autofix
      # commit; it is refreshed by the dedicated scheduled workflow at
      # `.github/workflows/update-iconify-collections.yml`.
      - name: Discard generated iconify collection changes
        run: git checkout HEAD -- packages-presets/preset-icons/src/collections.ts

      - uses: autofix-ci/action@v1
